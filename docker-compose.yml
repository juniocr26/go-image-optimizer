services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    profiles:
      - test
    working_dir: /src
    environment:
      CGO_ENABLED: 1
      REAL_IMAGE_FIXTURES_DIR: /testdata/images
    volumes:
      - ./backend:/src
      - ./storage/testdata/images:/testdata/images:ro
    command: ["go", "test", "-v", "./..."]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    profiles:
      - dev
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next

volumes:
  frontend-node-modules:
  frontend-next:
