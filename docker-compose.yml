services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./storage:${STORAGE_PATH:-/app/storage}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
